<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">♧</div><div><div class="brand-name">lab<span style="color:var(--teal)">sphere.</span></div><div class="brand-sub">LABORATORY MANAGEMENT</div></div></div><div class="nav-label">Workspace</div><div id="nav-main"></div><div class="nav-label">Administration</div><div id="nav-admin"></div><div class="sidebar-foot"><div class="avatar">LA</div><div><div style="font-size:12px;font-weight:800">Lab Administrator</div><div class="small">ผู้ดูแลห้องปฏิบัติการ</div></div></div></aside><div class="cover" id="cover" onclick="toggleNav(false)"></div>
<main class="main"><header class="topbar"><div class="top-left"><button class="icon-btn mobile-toggle" onclick="toggleNav(true)" aria-label="เปิดเมนู"><svg class="i"><use href="#menu"/></svg></button><span class="top-label">กำลังดูข้อมูล</span><select class="lab-switch" id="lab" aria-label="เลือกห้องปฏิบัติการ"><option value="chem">ห้องเคมีวิเคราะห์</option><option value="bio">ห้องวิจัยชีวภาพ</option><option value="mat">ห้องวัสดุศาสตร์</option></select></div><div class="top-right"><input id="qtop" class="search" placeholder="ค้นหาสารเคมี เครื่องมือ..." aria-label="ค้นหาสารเคมีและเครื่องมือ"/><button class="icon-btn unread" title="การแจ้งเตือน" onclick="route('approval')"><svg class="i"><use href="#bell"/></svg></button><div class="avatar" title="ผู้ดูแลระบบ">LA</div></div></header><div class="content" id="content"></div></main></div><div class="watermark">DESIGN PREVIEW · ข้อมูลตัวอย่าง</div>
<div class="modal-layer" id="modalLayer"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><div class="eyebrow">ตัวอย่างหน้าจอ</div><div class="modal-title" id="modalTitle">ทำรายการใหม่</div></div><button class="icon-btn" onclick="hideModal()" aria-label="ปิด"><svg class="i"><use href="#close"/></svg></button></div><div class="banner"><svg class="i" style="flex:0 0 18px"><use href="#alert"/></svg><div>นี่เป็น <strong>ตัวอย่างงานออกแบบ</strong> ยังไม่เชื่อมต่อระบบฐานข้อมูล</div></div><div id="modalFields"></div><div class="modal-actions"><button class="btn" onclick="hideModal()">ยกเลิก</button><button class="btn primary" onclick="demoSave()">ดูตัวอย่างการบันทึก</button></div></div></div><div class="toast" id="toast"></div>
<script>
const icons={dashboard:'dashboard',chemicals:'flask',withdrawals:'box',equipment:'tool',calendar:'calendar',issues:'alert',approval:'check',safety:'shield',members:'users',reports:'report',settings:'settings'};
const menu=[['dashboard','ภาพรวม'],['chemicals','สารเคมีและสต็อก'],['withdrawals','การเบิกสารเคมี'],['equipment','ทะเบียนเครื่องมือ'],['calendar','ปฏิทินการจอง'],['issues','แจ้งซ่อมและบำรุงรักษา'],['safety','ความปลอดภัยและเอกสาร']];const admin=[['approval','งานรออนุมัติ'],['members','สมาชิกและสิทธิ์'],['reports','รายงานและสถิติ'],['settings','ตั้งค่าห้องปฏิบัติการ']];let page='dashboard', currentLab='chem';
const chem=[['Ethanol 95%','C₂H₆O','64-17-5','850 mL','ตู้ A-01','ใกล้หมด','warn'],['Sodium Chloride','NaCl','7647-14-5','1.8 kg','ตู้ A-03','พร้อมใช้','good'],['Hydrochloric Acid 37%','HCl','7647-01-0','400 mL','ตู้ B-02','สารอันตราย','bad'],['Acetone','C₃H₆O','67-64-1','2.3 L','ตู้ A-01','พร้อมใช้','good'],['Sodium Hydroxide','NaOH','1310-73-2','650 g','ตู้ B-03','พร้อมใช้','good']];
const icon=(s)=>`<svg class="i"><use href="#${s}"/></svg>`;const tag=(s,k='good')=>`<span class="pill ${k==='good'?'':k}">${s}</span>`;
function renderNav(){document.getElementById('nav-main').innerHTML=menu.map(([id,name])=>nav(id,name)).join('');document.getElementById('nav-admin').innerHTML=admin.map(([id,name])=>nav(id,name)).join('')}
function nav(id,name){return `<button class="nav ${page===id?'active':''}" onclick="route('${id}')">${icon(icons[id])}<span>${name}</span>${id==='approval'?'<span class="nav-count">7</span>':''}</button>`}
function header(title,description,actions=''){return `<div class="page-head"><div><div class="eyebrow">LABSPHERE / ${title}</div><h1 class="page-title">${title}</h1><p class="sub">${description}</p></div><div class="controls">${actions}</div></div>`}
const button=(s,action,primary=false,ic='plus')=>`<button class="btn ${primary?'primary':''}" onclick="${action}">${icon(ic)} ${s}</button>`;
function metric(name,value,note,ico,style=''){return `<div class="metric"><div class="metric-top"><span>${name}</span><span class="metric-icon ${style}">${icon(ico)}</span></div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`}
function table(headers,rows){return `<div class="table-scroller"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}

function renderCalendar(){const week=['จันทร์ 26','อังคาร 27','พุธ 28','พฤหัส 29','ศุกร์ 30'];return header('ปฏิทินการจอง','ดูช่วงเวลาว่างและจัดการการจองเครื่องมือในห้องทดลอง',button('จองเครื่องมือ',"showModal('จองเครื่องมือ')",true,'calendar'))+`<div class="banner">${icon('calendar')} <div><strong>โควตาการจองของคุณ</strong> ใช้ไปแล้ว 2 / 3 วันในสัปดาห์นี้ <div class="progress" style="width:260px"><span style="width:66%"></span></div></div></div><section class="panel"><div class="panel-h"><div><div class="panel-title">ตารางการใช้เครื่องมือ</div><div class="panel-sub">26–30 ตุลาคม 2569 · ข้อมูลตัวอย่าง</div></div><select class="filter" onchange="tip('เปลี่ยนตัวกรองตัวอย่างสำเร็จ')"><option>เครื่องมือทั้งหมด</option><option>Centrifuge</option><option>HPLC</option><option>Analytical Balance</option></select></div><div class="table-scroller"><div class="calendar-grid"><div class="cal-head">เวลา</div>${week.map(x=>`<div class="cal-head">${x}</div>`).join('')}${['09:00','11:00','13:00','15:00'].map((h,ri)=>`<div class="cal-hour">${h}</div>${week.map((w,ci)=>{const v=ri===0&&ci===0?'<div class="book">Centrifuge<br><b>09:00–11:00</b></div>':ri===1&&ci===2?'<div class="book pending">HPLC<br><b>รออนุมัติ</b></div>':ri===2&&ci===3?'<div class="book blocked">pH Meter<br><b>ปิดซ่อม</b></div>':ri===3&&ci===4?'<div class="book">Analytical Balance<br><b>15:00–17:00</b></div>':'';return `<div class="cal-slot" onclick="showModal('จองเครื่องมือ')">${v}</div>`}).join('')}`).join('')}</div></div></section>`}

function renderReports(){return header('รายงานและสถิติ','สรุปการใช้งานและตรวจสอบย้อนหลังของห้องปฏิบัติการ',button('ส่งออก CSV',"tip('ตัวอย่างหน้าจอ: ระบบจริงจะสร้าง CSV จากข้อมูลใน PostgreSQL')",true,'report'))+`<div class="metrics">${metric('รายการเบิกเดือนนี้','68','ครั้งที่จ่ายสารจริง','flask')}${metric('อัตราใช้เครื่องมือ','72%','ตัวเลขตัวอย่าง','report','blue')}${metric('เวลารออนุมัติ','4.6 ชม.','เฉลี่ยตัวอย่าง','clock')}${metric('ปิดงานซ่อม','12','รายการในไตรมาส','check')}</div><div class="two-col"><section class="panel"><div class="panel-h"><div class="panel-title">รายงานที่สร้างได้</div></div><div class="list-stack">${['ปริมาณสารเคมีคงเหลือและใกล้หมด','สรุปการเบิกใช้สารเคมีรายเดือน','ประสิทธิภาพการใช้เครื่องมือ','การบำรุงรักษาและเครื่องมือชำรุด','ประวัติการอนุมัติและ Audit Log'].map(x=>`<div class="list-line"><div class="card-line"><span class="round-icon">${icon('report')}</span><div class="cell-strong">${x}</div></div><button class="link" onclick="tip('ตัวอย่างหน้าจอรายงาน')">เปิด →</button></div>`).join('')}</div></section><section class="panel"><div class="panel-h"><div class="panel-title">รายการใช้งานสัปดาห์นี้</div></div><div class="chart-wrap"><svg class="chart" viewBox="0 0 500 210"><path d="M15 35H490M15 85H490M15 135H490M15 185H490" stroke="#edf1f3"/><g fill="#0c8074"><rect x="33" y="104" width="33" height="81" rx="5"/><rect x="103" y="72" width="33" height="113" rx="5"/><rect x="173" y="56" width="33" height="129" rx="5"/><rect x="243" y="90" width="33" height="95" rx="5"/><rect x="313" y="42" width="33" height="143" rx="5"/><rect x="383" y="120" width="33" height="65" rx="5"/></g></svg><div class="chart-caption"><span>จ.</span><span>อ.</span><span>พ.</span><span>พฤ.</span><span>ศ.</span><span>ส.</span></div></div></section></div>`}
function renderSettings(){return header('ตั้งค่าห้องปฏิบัติการ','แก้ไขนโยบายการจอง การแจ้งเตือน และข้อมูลสถานที่',button('บันทึกการตั้งค่า',"tip('ตัวอย่างดีไซน์: ยังไม่ได้บันทึกฐานข้อมูล')",true,'check'))+`<section class="panel" style="padding:22px;max-width:850px"><div class="panel-title" style="margin-bottom:19px">นโยบายของห้องปฏิบัติการ</div><div class="formrow"><div class="field"><label>ชื่อห้องปฏิบัติการ</label><input value="ห้องเคมีวิเคราะห์"></div><div class="field"><label>รหัสห้อง</label><input value="CHEM-LAB-01"></div><div class="field"><label>จำนวนวันจองสูงสุด / สัปดาห์</label><input type="number" value="3" min="1"></div><div class="field"><label>วันเริ่มต้นสัปดาห์</label><select><option>วันจันทร์</option></select></div><div class="field"><label>วิธีอนุมัติการจอง</label><select><option>ต้องมีผู้ดูแลอนุมัติทุกครั้ง</option></select></div><div class="field"><label>การแจ้งเตือน</label><select><option>In-App + Email</option><option>In-App</option></select></div></div><div class="banner">${icon('shield')} <div>ระบบจริงต้องตรวจสิทธิ์ก่อนบันทึกการเปลี่ยนแปลงนโยบายทุกครั้ง และบันทึก Audit Log</div></div></section>`}
const pages={dashboard:renderDashboard,chemicals:renderChemicals,withdrawals:renderWithdrawals,equipment:renderEquipment,calendar:renderCalendar,issues:renderIssues,approval:renderApproval,safety:renderSafety,members:renderMembers,reports:renderReports,settings:renderSettings};
function route(p){page=p;renderNav();document.getElementById('content').innerHTML=pages[page]();if(page==='chemicals')filterChem();toggleNav(false);window.scrollTo(0,0)}
function toggleNav(b){document.getElementById('sidebar').classList.toggle('open',b);document.getElementById('cover').classList.toggle('show',b)}
function showModal(t){document.getElementById('modalTitle').textContent=t;const booking=t.includes('จอง'),chemical=t.includes('สาร');document.getElementById('modalFields').innerHTML=booking?'<div class="field"><label>เครื่องมือ</label><select><option>Centrifuge CF-01</option><option>HPLC System HP-01</option></select></div><div class="formrow"><div class="field"><label>วันเริ่มต้น</label><input type="date" value="2026-10-28"></div><div class="field"><label>วันสิ้นสุด</label><input type="date" value="2026-10-28"></div></div><div class="field"><label>เหตุผลการใช้งาน</label><input placeholder="เช่น โครงงานวิจัย"></div>':chemical?'<div class="field"><label>สารเคมี</label><input placeholder="ระบุชื่อสารเคมี"></div><div class="formrow"><div class="field"><label>ปริมาณ</label><input type="number" value="100"></div><div class="field"><label>หน่วย</label><select><option>mL</option><option>g</option><option>L</option></select></div></div><div class="field"><label>จุดจัดเก็บหรือเหตุผล</label><input placeholder="กรอกรายละเอียด"></div>':'<div class="field"><label>รายละเอียด</label><input placeholder="กรอกข้อมูลของรายการ"></div>';document.getElementById('modalLayer').classList.add('show')}
function hideModal(){document.getElementById('modalLayer').classList.remove('show')}
function demoSave(){hideModal();tip('นี่เป็น UI Preview — ปุ่มบันทึกจริงจะทำงานเมื่อ Codex พัฒนา API/DB เสร็จ')}
let timer;function tip(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),3500)}
document.getElementById('lab').addEventListener('change',e=>{currentLab=e.target.value;route(page);tip('เปลี่ยนห้องในตัวอย่างสำเร็จ — ระบบจริงจะแยกข้อมูลตามห้อง')});document.getElementById('qtop').addEventListener('keydown',e=>{if(e.key==='Enter'){route('chemicals');document.getElementById('chemSearch').value=e.target.value;filterChem()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal()});document.getElementById('modalLayer').addEventListener('click',e=>{if(e.target.id==='modalLayer')hideModal()});route('dashboard');
</script></body></html>
