name: labsphere-local
services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: labsphere
      POSTGRES_USER: labsphere
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run npm run setup:local}
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes: ["labsphere_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labsphere -d labsphere"]
      interval: 3s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.29.2
    ports: ["127.0.0.1:${SMTP_PORT:-1025}:1025", "127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
volumes:
  labsphere_pg:
