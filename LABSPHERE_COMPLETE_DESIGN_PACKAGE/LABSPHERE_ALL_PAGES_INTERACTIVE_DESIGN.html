function panel(title,body,extra='',desc=''){return `<section class="panel"><div class="panel-h"><div><div class="panel-title">${title}</div>${desc?`<div class="panel-desc">${desc}</div>`:''}</div>${extra}</div>${body}</section>`};
function table(headers,rows){return `<div class="tablewrap"><table class="tbl"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty-box">ไม่มีข้อมูลในตัวอย่างห้องนี้</td></tr>`}</tbody></table></div>`};
function panelRows(rows){return `<div class="panel-body">${rows.join('')}</div>`};
function listItem(ic,title,sub,goTo,cta='ดูรายละเอียด',tone=''){return `<div class="listrow"><div class="row-main"><span class="round-icon ${tone}">${icon(ic)}</span><div><div class="cellstrong">${title}</div><div class="cellsub">${sub}</div></div></div><button class="panel-action" data-go="${goTo}">${cta} ›</button></div>`};
function meta(keys){return `<div class="detail-meta">${keys.map(([k,v])=>`<div class="meta-box"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>`};
function tabs(list){return `<div class="page-tabs">${list.map((x,i)=>`<button class="tab ${state.tab===i?'active':''}" data-tab="${i}">${x}</button>`).join('')}</div>`};
function f(label,type='text',value='',opts='',help=''){let id=label.replace(/\s/g,'-');let field=type==='select'?`<select class="field-input" aria-label="${label}">${opts.split('|').map(x=>`<option>${x}</option>`).join('')}</select>`:type==='textarea'?`<textarea class="field-input" rows="3" placeholder="${esc(value)}"></textarea>`:`<input class="field-input" aria-label="${label}" type="${type}" ${value?`value="${esc(value)}"`:''} placeholder="${esc(value||label)}">`;return `<div class="field"><label>${label}</label>${field}${help?`<small>${help}</small>`:''}</div>`};
function formCard(title,fields,notice='',save='บันทึกตัวอย่าง'){return `<section class="panel narrow"><div class="panel-h"><div class="panel-title">${title}</div>${tag('ตัวอย่างดีไซน์','blue')}</div><form class="form-area" data-demo-form><div class="form-grid">${fields}</div>${notice?`<div class="form-note">${icon('info')} ${notice}</div>`:''}<div class="form-actions">${btn('กลับ','screens')}${action(save,'demo-submit','primary','check')}</div></form></section>`};
function rowsChemical(){let q=state.query.toLowerCase();return chemicals.filter(x=>x.lab===state.lab&&(!q||[x.name,x.cas,x.id].some(y=>y.toLowerCase().includes(q)))).map(x=>`<tr><td><div class="cellstrong">${x.name}</div><div class="cellsub">${x.formula} · ${x.id}</div></td><td>${x.cas}</td><td>${x.bottles} ขวด</td><td class="cellstrong">${x.qty}</td><td>${x.loc}</td><td>${tag(x.status,x.tone)}</td><td><button class="panel-action" data-go="chemical-detail">รายละเอียด ›</button></td></tr>`)}
function chemicalTable(){return table(['สารเคมี / รหัส','CAS Number','จำนวนขวด','คงเหลือ','ตำแหน่งจัดเก็บ','สถานะ',''],rowsChemical())};
function rowsEquipment(){let q=state.query.toLowerCase();return equipment.filter(x=>x.lab===state.lab&&(!q||[x.name,x.asset,x.model].some(y=>y.toLowerCase().includes(q)))).map(x=>`<tr><td><div class="cellstrong">${x.name}</div><div class="cellsub">${x.asset} · ${x.model}</div></td><td>${x.room}</td><td>${tag(x.status,x.tone)}</td><td>26 ต.ค. 2569</td><td><button class="panel-action" data-go="equipment-detail">ดูเครื่องมือ ›</button></td></tr>`)}

function platformUsers(){return header('ผู้ใช้งานทั้งหมด','บัญชีผู้ใช้ระดับแพลตฟอร์ม บทบาทส่วนกลาง และสมาชิกภาพรายห้อง',action('เชิญ Platform Admin','demo','primary','plus'),'PLATFORM ADMINISTRATION')+panel('บัญชีผู้ใช้',table(['บัญชี','อีเมล','สมาชิกภาพ','บทบาท','สถานะ',''],members.map(x=>`<tr><td class="cellstrong">${x.name}</td><td>${x.email}</td><td>${x.lab}</td><td>${x.role}</td><td>${tag(x.status,x.tone)}</td><td><button class="panel-action" data-action="demo">จัดการ ›</button></td></tr>`)))};
function platformAudit(){return header('Audit Log ระดับแพลตฟอร์ม','ตรวจสอบเหตุการณ์ข้ามห้องภายใต้สิทธิ์ Super Admin',action('Export Audit','demo','', 'download'),'PLATFORM ADMINISTRATION')+panel('เหตุการณ์ล่าสุด',table(['เวลา','ผู้ดำเนินการ','การกระทำ','รายการ','ห้อง'],audit.map(x=>`<tr><td>${x.time}</td><td>${x.actor}</td><td>${x.event}</td><td class="cellstrong">${x.entity}</td><td>CHEM-01</td></tr>`)))};
function platformHealth(){return header('สถานะบริการและการตรวจสอบ','ต้นแบบการออกแบบหน้า Monitoring เท่านั้น ยังไม่ได้ตรวจ Health ระบบจริง',action('รีเฟรชตัวอย่าง','demo','','refresh'),'PLATFORM ADMINISTRATION')+notice('ค่าต่อไปนี้เป็น Mock UI เท่านั้น ไม่ใช่ผลตรวจของ PostgreSQL, API, Storage หรือ Queue จริง')+`<div class="stats">${stat('Web UI','Design','ยังไม่ได้ติดตั้ง Vite App','grid','blue')}${stat('Backend API','Not linked','ตัวอย่างเท่านั้น','report','orange')}${stat('PostgreSQL','Not linked','ยังไม่มี Docker DB ของตัวอย่างนี้','box','orange')}${stat('SMTP / Queue','Not linked','ยังไม่ต่อ Mailpit','mail','orange')}</div>${panel('องค์ประกอบที่จะตรวจในระบบจริง',panelRows([listItem('shield','Health / Readiness','API + DB + Worker + Scheduler','platform-health'),listItem('history','Error / Audit Monitoring','Response Time / Error Rate / Queue','platform-audit'),listItem('refresh','Backup / Restore Drill','บันทึกผลการทดสอบกู้คืน','settings')]))}`};
function errorPage(type){let e={forbidden:['403','ไม่มีสิทธิ์เข้าถึง','บัญชีนี้ไม่มีสิทธิ์เปิดหน้านี้ กรุณาตรวจสอบบทบาทกับผู้ดูแลห้อง','lock'],'not-found':['404','ไม่พบหน้าที่คุณต้องการ','ลิงก์อาจเปลี่ยนแปลง หรือหน้าดังกล่าวไม่มีอยู่ในระบบ','search'],offline:['Offline','ไม่สามารถเชื่อมต่อบริการได้','กรุณาตรวจสอบการเชื่อมต่อ แล้วลองใหม่อีกครั้ง','alert']}[type];return `<section class="panel" style="max-width:620px;margin:65px auto;text-align:center"><div class="panel-body" style="padding:45px"><div class="round-icon" style="height:64px;width:64px;margin:0 auto 20px">${icon(e[3])}</div><h1 style="font-size:38px;color:var(--brand)">${e[0]}</h1><h2 style="font-size:20px;margin:12px 0">${e[1]}</h2><p class="muted" style="margin-bottom:24px">${e[2]}</p>${btn('กลับ Dashboard','dashboard',true,'back')} ${btn('สารบัญหน้าจอ','screens')}</div></section>`}
const pages={'screens':screens,'dashboard':dashboard,'chemicals':chemicalsPage,'chemical-new':()=>header('เพิ่มรายการสารเคมี','สร้างทะเบียนชนิดสารพร้อมข้อมูลความปลอดภัย',btn('ย้อนกลับทะเบียน','chemicals'))+formCard('ข้อมูลสารเคมีใหม่',f('ชื่อสารเคมี (EN)','','Ethanol')+f('ชื่อสารเคมี (TH)','','เอทานอล')+f('CAS Number','','64-17-5')+f('สูตรเคมี','','C₂H₆O')+f('หน่วยสต็อกหลัก','select','','mL|L|g|kg')+f('หมวดอันตราย','select','','ไวไฟ|กัดกร่อน|พิษ|ทั่วไป')+f('เกณฑ์แจ้งเตือน','number','700')+f('ตำแหน่งจัดเก็บเริ่มต้น','select','','ตู้ไวไฟ F-01|ตู้กรด AC-01|ตู้ A-02')+f('ไฟล์ SDS','file')+f('หมายเหตุการจัดเก็บ','textarea','ระบุข้อควรระวังและข้อมูลการจัดเก็บ'),'ทะเบียนสารเป็นระดับชนิดสาร ส่วน Lot และขวดเพิ่มแยกต่างหาก'),'chemical-detail':chemicalDetail,'container-detail':containerDetail,'receive':receive,'withdrawals':withdrawalsPage,'withdrawal-detail':withdrawalDetail,'stocktakes':stocktakes,'transfers':transfers,'waste':waste,'equipment':equipmentPage,'equipment-detail':equipmentDetail,'calendar':calendarPage,'bookings':bookingsPage,'booking-new':bookingNew,'booking-detail':bookingDetail,'issues':issuesPage,'issue-new':issueNew,'issue-detail':issueDetail,'maintenance':maintenancePage,'maintenance-detail':maintenanceDetail,'safety':safety,'documents':documentsPage,'training':trainingPage,'approvals':approvalsPage,'members':membersPage,'reports':reportsPage,'activity':activityPage,'settings':settingsPage,'notifications':notificationsPage,'profile':profilePage,'security':securityPage,'select-lab':selectLab,'platform':platform,'platform-labs':platformLabs,'platform-lab-detail':platformLabDetail,'platform-orgs':platformOrgs,'platform-users':platformUsers,'platform-audit':platformAudit,'platform-health':platformHealth,'forbidden':()=>errorPage('forbidden'),'not-found':()=>errorPage('not-found'),'offline':()=>errorPage('offline')};
function sidebar(){return `<aside class="side ${state.menu?'open':''}" id="sidebar"><div class="side-inner"><div class="identity" data-go="screens"><span class="logo">${icon('flask')}</span><div><div class="identity-name">LabSphere</div><div class="identity-caption">LABORATORY MANAGEMENT</div></div></div>${NAV.map(([group,items])=>`<div class="group-label">${group}</div>${items.map(([id,label,ico])=>`<button class="nav-item ${state.page===id?'active':''}" data-go="${id}">${icon(ico)}<span>${label}</span>${id==='approvals'?'<span class="nav-count">7</span>':''}</button>`).join('')}`).join('')}</div><div class="side-bottom"><div class="support-box"><div class="row-main"><span class="avatar">วจ</span><div><div class="semibold" style="font-size:12px">ผู้ใช้งานตัวอย่าง</div><div class="tiny muted">${state.role}</div></div></div><div class="sep"></div><button class="panel-action" data-go="profile">ดูโปรไฟล์บัญชี ↗</button></div></div></aside>`}
function shell(){let authPages=['login','register','verify-email','forgot-password','reset-password','invite-accept'];if(authPages.includes(state.page))return auth(state.page);return `<div class="shell">${sidebar()}<div class="workspace"><header class="topbar"><div class="top-l"><button class="icon-button menu-toggle" data-action="toggle-menu" aria-label="เปิดเมนู">${icon('menu')}</button><span class="top-label">ห้องปฏิบัติการ</span><select class="select top-lab" id="lab-select" aria-label="เลือกห้องปฏิบัติการ">${LABS.map(l=>`<option value="${l.id}" ${l.id===state.lab?'selected':''}>${l.name}</option>`).join('')}</select><span class="demo-flag">● UI PREVIEW ONLY</span></div><div class="top-r"><input class="search-input top-search" id="top-search" placeholder="ค้นหาหน้าจอ..." title="ค้นหาชื่อหน้าจอ แล้วกด Enter"><select id="role-select" class="select" aria-label="บทบาทตัวอย่าง"><option ${state.role==='Lab Admin'?'selected':''}>Lab Admin</option><option ${state.role==='Lab Member'?'selected':''}>Lab Member</option><option ${state.role==='Super Admin'?'selected':''}>Super Admin</option></select><button class="icon-button" data-go="notifications" aria-label="การแจ้งเตือน">${icon('bell')}</button><button class="icon-button" data-go="profile" aria-label="โปรไฟล์">${icon('user')}</button></div></header><main class="content" id="main-content">${pages[state.page]?pages[state.page]():errorPage('not-found')}<footer class="footer"><span>LabSphere Design System · Interactive Prototype · ${TOTAL} หน้าจอ · ข้อมูลจำลอง</span><span>White / Teal / Navy · Desktop / Tablet / Mobile</span></footer></main></div></div>`}
function render(){document.getElementById('app').innerHTML=shell();let cover=document.getElementById('cover');cover.classList.toggle('show',state.menu);}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove('show'),3900)}
function modal(title,copy,fn){document.getElementById('modal-title').textContent=title;document.getElementById('modal-copy').textContent=copy;state.modalAction=fn;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show');state.modalAction=null}
function updateDemo(kind){if(kind==='approve-withdrawal'){let x=withdrawals.find(x=>x.lab===state.lab);if(x){x.status='อนุมัติแล้ว';x.tone='blue';toast('สาธิตการอนุมัติคำขอแล้ว · ไม่ได้บันทึกฐานข้อมูล')} }else if(kind==='reject-withdrawal'){let x=withdrawals.find(x=>x.lab===state.lab);if(x){x.status='ปฏิเสธ';x.tone='bad';toast('สาธิตการปฏิเสธคำขอแล้ว')}}else if(kind==='dispense-withdrawal'){let x=withdrawals.find(x=>x.lab===state.lab);if(x){x.status='จ่ายสารแล้ว';x.tone='good';toast('สาธิตการจ่ายสารแล้ว · ยอดจริงไม่เปลี่ยน')}}else if(kind==='approve-booking'){let x=bookings.find(x=>x.lab===state.lab);if(x){x.status='อนุมัติแล้ว';x.tone='blue';toast('สาธิตการอนุมัติจองแล้ว')}}else if(kind==='reject-booking'){let x=bookings.find(x=>x.lab===state.lab);if(x){x.status='ปฏิเสธ';x.tone='bad';toast('สาธิตการปฏิเสธแล้ว')}}else toast('นี่คือ UI Design Preview · การบันทึก/การส่ง/การโหลดไฟล์จริงต้องพัฒนา Backend ต่อ');render()}
document.addEventListener('click',e=>{const labBtn=e.target.closest('[data-select-lab]');if(labBtn){state.lab=labBtn.dataset.selectLab;go('dashboard');return}const dest=e.target.closest('[data-go]');if(dest){go(dest.dataset.go);return}const a=e.target.closest('[data-action]');if(a){let k=a.dataset.action;if(k==='toggle-menu'){state.menu=!state.menu;render();return}if(k==='close-modal'){closeModal();return}if(k==='modal-confirm'){if(state.modalAction)state.modalAction();closeModal();return}if(k==='apply-filter'){state.query=document.querySelector('[data-filter-input]')?.value||'';render();return}if(k==='clear-filter'){state.query='';render();return}if(k==='auth-next'){let next={'login':'select-lab','register':'verify-email','verify-email':'login','forgot-password':'reset-password','reset-password':'login','invite-accept':'select-lab'}[state.page];go(next||'dashboard');toast('กำลังจำลองการเปลี่ยนหน้าจอ — ยังไม่ยืนยันตัวตนจริง');return}if(k==='demo-submit'){toast('รูปแบบฟอร์มพร้อมแล้ว — ตัวอย่าง UI เท่านั้น ยังไม่ได้บันทึกฐานข้อมูล');return}if(['approve-withdrawal','reject-withdrawal','dispense-withdrawal','approve-booking','reject-booking'].includes(k)){modal('ยืนยันการทำรายการตัวอย่าง','การเปลี่ยนแปลงนี้อยู่ในหน่วยความจำชั่วคราวของหน้าเว็บ ไม่ใช่การอนุมัติหรือปรับยอดจริง',()=>updateDemo(k));return}if(['checkin-booking','checkout-booking'].includes(k)){toast('ตัวอย่าง '+(k==='checkin-booking'?'Check-in':'Check-out')+' เท่านั้น ยังไม่มีการบันทึกใช้งานจริง');return}toast('ตัวอย่างหน้าจอสำหรับพัฒนา · ยังไม่ได้เชื่อม API หรือข้อมูลจริง');return}const tab=e.target.closest('[data-tab]');if(tab){state.tab=Number(tab.dataset.tab);render();return}});
document.addEventListener('submit',e=>{if(e.target.matches('[data-demo-form]')){e.preventDefault();toast('นี่เป็นฟอร์มดีไซน์ ยังไม่มี API หรือฐานข้อมูลจริง')}});
document.addEventListener('change',e=>{if(e.target.id==='lab-select'){state.lab=e.target.value;state.query='';render();toast('สลับบริบทห้องสาธิต: '+lab().name)}else if(e.target.id==='role-select'){state.role=e.target.value;render();toast('สลับบทบาทเพื่อดูธีม · ระบบจริงต้องบังคับสิทธิ์ฝั่ง API')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(state.menu){state.menu=false;render()}}if(e.key==='Enter'&&e.target.id==='top-search'){let q=e.target.value.trim();let match=REG.flatMap(g=>g[1]).find(([id,title])=>id.toLowerCase().includes(q.toLowerCase())||title.includes(q));if(match)go(match[0]);else {go('screens');toast('ไม่พบหน้าจอชื่อ '+q)}}if(e.key==='Enter'&&e.target.matches('[data-filter-input]')){state.query=e.target.value;render()}});
document.getElementById('cover').addEventListener('click',()=>{state.menu=false;render()});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});window.addEventListener('hashchange',()=>{let n=location.hash.slice(1);if(n&&n!==state.page){state.page=n;state.tab=0;render()}});
render();
</script>
</body></html>
